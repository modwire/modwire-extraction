[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modwire-extraction"
dynamic = ["version"]
description = "Extraction implementation for modwire."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]
keywords = ["code-analysis", "dependency-graph", "extraction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/modwire/modwire-extraction"
Repository = "https://github.com/modwire/modwire-extraction"
Issues = "https://github.com/modwire/modwire-extraction/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.11",
    "twine>=5",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.11",
    "twine>=5",
]

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback_version = "0.0.0"

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportAbstractUsage = "error"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"modwire_extraction.extractors.languages.python" = [
    "*.py",
]
"modwire_extraction.extractors.languages.php" = [
    "*.php",
    "*.json",
    "*.lock",
]
"modwire_extraction.extractors.languages.typescript" = [
    "*.js",
    "*.json",
    "*.mjs",
    "*.ts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".dev/cache/pytest"

[tool.ruff]
cache-dir = ".dev/cache/ruff"
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
data_file = ".dev/coverage/.coverage"

[tool.coverage.html]
directory = ".dev/coverage/html"

[tool.coverage.xml]
output = ".dev/coverage/coverage.xml"
